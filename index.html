
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main { text-align: center; }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="message">Hello, World!</h1>
    <button id="changeButton">Click me</button>
  </main>
  <script>
    document.getElementById('changeButton').addEventListener('click', () => {
      document.getElementById('message').textContent = 'Hello from JavaScript!';
    });
  </script>
</body>
</html>
